[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wiseway"
version = "0.1.0"
description = "Wise Way synthetic demo backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "PyYAML>=6.0.2,<7",
  "jsonschema[format]>=4.25,<5",
  "argon2-cffi>=23.1,<26",
]

[project.scripts]
wiseway = "wiseway.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2", "openapi-spec-validator>=0.7,<0.9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["wiseway*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
wiseway = ["migrations/*.sql"]

[tool.setuptools.data-files]
"share/wiseway" = ["contracts/openapi/wiseway-v1.yaml"]
