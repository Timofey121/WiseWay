                  company_id: company-atlas
                  from: '2031-05-10T00:00:00Z'
                  to: '2031-05-11T00:00:00Z'
                  actor_id: user-worker-1
                  action: BATCH_ACCEPTED
                  result: SUCCESS
                  query_text: quarterly
                  cursor: null
                  limit: 50
              allVisible:
                value:
                  company_id: null
                  from: '2031-05-10T00:00:00Z'
                  to: '2031-05-11T00:00:00Z'
                  actor_id: null
                  action: null
                  result: null
                  query_text: ''
                  cursor: null
                  limit: 100
      responses:
        '200':
          description: The audit event page in occurred_at descending, event_id descending order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditQueryResponse' }
              examples:
                events:
                  value:
                    items:
                      - event_id: event-001
                        occurred_at: '2031-05-10T09:33:00Z'
                        actor:
                          user_id: user-worker-1
                          login: worker.one
                          display_name: Worker One
                          role: WORKER
                        category: BUSINESS
                        action: BATCH_ACCEPTED
                        result: SUCCESS
                        request_id: request-001
                        operation_id: batch-001
                        source_attempt_id: null
                        company_id: company-atlas
                        dictionary_id: null
                        version_id: null
                        rule_set_id: ruleset-5
                        batch_id: batch-001
                        attempt_id: null
                        item_id: null
                        source: null
                        target: null
                        reason_code: null
                        comment: null
                    next_cursor: null
                    newest_event_id: event-001
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
      tags: [ Audit ]
  /audit/updates:
    get:
      operationId: getAuditUpdates
      summary: Check whether newer audit events exist
      description: Проверяет новые доступные события, включая события вне текущего фильтра. Без after_event_id нижняя
        граница отсутствует.
      parameters:
        - name: after_event_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Id' }
          description: The newest event ID already observed. Omit it when the initial journal is empty.
      responses:
        '200':
          description: Whether a later accessible event exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditUpdatesResponse' }
              examples:
                newEvents:
                  value:
                    has_new_events: true
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
      tags: [ Audit ]
  /audit/actors:
    get:
      operationId: listAuditActors
      summary: List valid audit author filters
      description: Авторы доступных событий, включая заблокированных. Prefix по login/имени; это не полный каталог
        аккаунтов.
      parameters:
        - { $ref: '#/components/parameters/Prefix' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: A cursor page of filterable actors.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActorPage' }
              examples:
                actors:
                  value:
                    items:
                      - user_id: user-worker-1
                        login: worker.one
                        display_name: Worker One
                        role: WORKER
                    next_cursor: null
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
      tags: [ Audit ]
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: wiseway_session
  parameters:
    CompanyId:
      name: company_id
      in: path
      required: true
      description: Непрозрачный логический идентификатор объекта.
      schema: { $ref: '#/components/schemas/Id' }
      example: company-demo-1
    CompanyIdQuery:
      name: company_id
      in: query
      required: true
      description: Компания, к которой относится запрашиваемый список.
      schema: { $ref: '#/components/schemas/Id' }
      example: company-demo-1
    DictionaryId:
      name: dictionary_id
      in: path
      required: true
      description: Непрозрачный логический идентификатор объекта.
      schema: { $ref: '#/components/schemas/Id' }
      example: dictionary-demo-1
    VersionId:
      name: version_id
      in: path
      required: true
      description: Непрозрачный логический идентификатор объекта.
      schema: { $ref: '#/components/schemas/Id' }
      example: version-demo-1
    SimulationId:
      name: simulation_id
      in: path
      required: true
      description: Непрозрачный логический идентификатор объекта.
      schema: { $ref: '#/components/schemas/Id' }
      example: simulation-demo-1
    PreviewId:
      name: preview_id
      in: path
      required: true
      description: Непрозрачный логический идентификатор объекта.
      schema: { $ref: '#/components/schemas/Id' }
      example: preview-demo-1
    BatchId:
      name: batch_id
      in: path
      required: true
      description: Непрозрачный логический идентификатор объекта.
      schema: { $ref: '#/components/schemas/Id' }
      example: batch-demo-1
    QuarantineId:
      name: quarantine_id
      in: path
      required: true
      description: Непрозрачный логический идентификатор объекта.
      schema: { $ref: '#/components/schemas/Id' }
      example: quarantine-demo-1
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный курсор, связанный с фильтрами и снимком; для первой страницы отсутствует.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы, по умолчанию 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    Prefix:
      name: prefix
      in: query
      required: false
      description: Регистронезависимое начало названия; отсутствие равно пустой строке.
      schema:
        type: string
        default: ''
    XCSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Токен сессии из login или /session. Сервер также проверяет Origin.
      schema:
        type: string
        minLength: 1
      example: synthetic-csrf-token-example
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID одной логической операции. Повтор с теми же user/operation/body возвращает исходный результат
        до проверки TTL; другое тело — IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        format: uuid
      example: 78d74c30-0db1-4d3c-8f23-13f721f53336
  headers:
    RequestId:
      required: true
      description: Идентификатор запроса; в ошибке совпадает с error.request_id.
      schema: { $ref: '#/components/schemas/Id' }
      example: request-demo-1
    NoStore:
      required: true
      description: Запрещает сохранять пользовательские ответы в HTTP-кэше.
      schema:
        type: string
        const: no-store
        example: no-store
    SetSessionCookie:
      required: true
      description: HttpOnly, SameSite=Lax, Path=/, без Domain. Secure обязателен при HTTPS, может отсутствовать
        только в loopback HTTP demo. Содержимое cookie не передаётся через JSON.
      schema:
        type: string
      example: wiseway_session=synthetic-session-placeholder; Path=/; HttpOnly; SameSite=Lax; Secure
    ClearedSessionCookie:
      required: true
      description: Удаляет wiseway_session с теми же Path/SameSite/HTTPS-атрибутами.
      schema:
        type: string
      example: wiseway_session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax; Secure
    RetryAfter:
      required: true
      description: Число секунд до допустимого повтора; первая версия использует delta-seconds.
      schema:
        type: string
        pattern: ^[0-9]+$
      example: '30'
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 96
      pattern: ^[A-Za-z0-9-]+$
      description: Непрозрачный логический ID; клиент не разбирает его смысл.
    Revision:
      type: integer
      minimum: 0
      description: Монотонная ревизия объекта. Один лишь claim не меняет содержательную ревизию файла.
    Count:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Точное неотрицательное целое в безопасном диапазоне JavaScript. Размер файла — в байтах.
    Instant:
      type: string
      format: date-time
      pattern: Z$
      description: RFC3339, UTC, завершающий Z.
      examples: [ '2031-05-10T09:30:00Z' ]
    RelativeDirectory:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: ^(?!.*(?:^|/)\.{1,2}(?:/|$))[^/\\:\u0000-\u001F\u007F]+(?:/[^/\\:\u0000-\u001F\u007F]+)*$
      description: Существующий подкаталог логического корня. Без пустых сегментов, . / .., обратного слеша, двоеточия
        и управляющих символов. Повторное URL-декодирование запрещено.
    RelativeFilePath:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: ^(?!.*(?:^|/)\.{1,2}(?:/|$))[^/\\:\u0000-\u001F\u007F]+(?:/[^/\\:\u0000-\u001F\u007F]+)*$
      description: Канонический путь от логического корня; последний сегмент — полное имя файла. Ограничения сегментов
        те же, что у RelativeDirectory.
    Location:
      type: object
      additionalProperties: false
      required: [ root_id, relative_path, display_path ]
      properties:
        root_id: { $ref: '#/components/schemas/Id' }
        relative_path: { $ref: '#/components/schemas/RelativeFilePath' }
        display_path:
          type: string
          minLength: 1
      description: Логическое размещение; display_path только для отображения/копирования, не физический путь и
        не основание доступа.
    Actor:
      type: object
      additionalProperties: false
      required: [ user_id, login, display_name, role ]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        login:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [ WORKER, ADMIN ]
      description: WORKER — общие рабочие права, ADMIN — также конфигурация/пользователи. В аудите сохраняется снимок
        автора на момент действия.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ ok ]
      description: Без сведений о внутренних зависимостях.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [ login, password ]
      properties:
        login:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
          format: password
      description: Синтетические credentials. Пароль не возвращается и не сохраняется в логах или browser storage.
    Session:
      type: object
      additionalProperties: false
      required: [ actor, expires_at, csrf_token ]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        expires_at: { $ref: '#/components/schemas/Instant' }
        csrf_token:
          type: string
          minLength: 1
      description: Серверная сессия без session ID в JSON. expires_at учитывает idle/absolute срок; csrf_token хранится
        только в памяти вкладки.
    AppConfig:
      type: object
      additionalProperties: false
      required: [ api_contract_version, display_timezone, search_result_limit, max_batch_items, max_query_length,
                  preview_ttl_seconds, snapshot_ttl_seconds, simulation_ttl_seconds, batch_poll_interval_ms, audit_poll_interval_ms ]
      properties:
        api_contract_version:
          type: string
        display_timezone:
          type: string
          description: IANA time zone. Демо Europe/Moscow.
        search_result_limit: { $ref: '#/components/schemas/Count' }
        max_batch_items: { $ref: '#/components/schemas/Count' }
        max_query_length: { $ref: '#/components/schemas/Count' }
        preview_ttl_seconds: { $ref: '#/components/schemas/Count' }
        snapshot_ttl_seconds: { $ref: '#/components/schemas/Count' }
        simulation_ttl_seconds: { $ref: '#/components/schemas/Count' }
        batch_poll_interval_ms: { $ref: '#/components/schemas/Count' }
        audit_poll_interval_ms: { $ref: '#/components/schemas/Count' }
      description: Фактические настройки UI. TTL также ограничиваются изменением зависимостей. Физические пути и
        секреты отсутствуют.
    Root:
      type: object
      additionalProperties: false
      required: [ root_id, label, display_prefix, schema_set_version, index_generation, indexed_at ]
      properties:
        root_id: { $ref: '#/components/schemas/Id' }
        label:
          type: string
        display_prefix:
          type: string
        schema_set_version: { $ref: '#/components/schemas/Id' }
        index_generation: { $ref: '#/components/schemas/Id' }
        indexed_at: { $ref: '#/components/schemas/Instant' }
      description: Поисковый корень, опубликованный после полного обхода и сверки.
    RootsResponse:
      type: object
      additionalProperties: false
      required: [ items ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Root' }
    Company:
      type: object
      additionalProperties: false
      required: [ company_id, name, incoming_source_ids ]
      properties:
        company_id: { $ref: '#/components/schemas/Id' }
        name:
          type: string
        incoming_source_ids:
          type: array
          items: { $ref: '#/components/schemas/Id' }
          uniqueItems: true
      description: Связанные входящие источники заданы логическими IDs; их названия доступны в source_name очереди.
    CompaniesResponse:
      type: object
      additionalProperties: false
      required: [ items ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Company' }
    SearchSort:
      type: object
      additionalProperties: false
      required: [ field, direction ]
      properties:
        field:
          type: string
          enum: [ RELEVANCE, PATH, NAME, MODIFIED_AT, SIZE ]
        direction:
          type: string
          enum: [ ASC, DESC ]
      description: 'По умолчанию с текстом RELEVANCE DESC, без текста PATH ASC. При равенстве: natural path ASC
        → raw path ASC → item_id ASC.'
      allOf:
        - if:
            properties:
              field:
                const: RELEVANCE
          then:
            properties:
              direction:
                const: DESC
    SearchRequest:
      type: object
      additionalProperties: false
      required: [ request_state_id, root_id, schema_set_version, selected_marker_ids, query_text, sort, facet_prefix ]
      properties:
        request_state_id:
          $ref: '#/components/schemas/Id'
          description: ID конкретной отправки. Повтор получает новый ID; дедупликация условий использует отдельный
            ключ.
        root_id: { $ref: '#/components/schemas/Id' }
        schema_set_version: { $ref: '#/components/schemas/Id' }
        selected_marker_ids:
          type: array
          items: { $ref: '#/components/schemas/Id' }
          uniqueItems: true
          description: Непрерывная цепочка от первого уровня; одно raw-значение на уровень. Текст применяется через
            AND.
        query_text:
          type: string
          maxLength: 512
          description: Все слова обязательны как регистронезависимые префиксы токенов. Двойные кавычки задают соседние
            полные токены в одном поле. Грамматика и ранжирование — в semantics.md.
        sort: { $ref: '#/components/schemas/SearchSort' }
        facet_prefix:
          type: string
          description: Prefix только следующего списка; не меняет items/total и точность counts.
      description: Непрерывная цепочка одного корня. Недопустимый маркер — INVALID_MARKER_SELECTION, новая схема
        — SCHEMA_VERSION_CHANGED. RELEVANCE требует непустой текст.
      allOf:
        - if:
            properties:
              sort:
                properties:
                  field:
                    const: RELEVANCE
          then:
            properties:
              query_text:
                pattern: \S
    FacetRequest:
      type: object
      additionalProperties: false
      required: [ request_state_id, root_id, schema_set_version, selected_marker_ids, query_text, facet_prefix ]
      properties:
        request_state_id:
          $ref: '#/components/schemas/Id'
          description: ID конкретной отправки. Повтор получает новый ID; дедупликация условий использует отдельный
            ключ.
        root_id: { $ref: '#/components/schemas/Id' }
        schema_set_version: { $ref: '#/components/schemas/Id' }
        selected_marker_ids:
          type: array
          items: { $ref: '#/components/schemas/Id' }
          uniqueItems: true
          description: Непрерывная цепочка от первого уровня; одно raw-значение на уровень. Текст применяется через
            AND.
        query_text:
          type: string
          maxLength: 512
          description: Все слова обязательны как регистронезависимые префиксы токенов. Двойные кавычки задают соседние
            полные токены в одном поле. Грамматика и ранжирование — в semantics.md.
        facet_prefix:
          type: string
          description: Prefix только следующего списка; не меняет items/total и точность counts.
      description: selected_marker_ids содержит только родителей редактируемого уровня. Не изменяет основную таблицу.
    Marker:
      type: object
      additionalProperties: false
      required: [ marker_id, level_id, level_name, raw_value, display_value, kind ]
      properties:
        marker_id: { $ref: '#/components/schemas/Id' }
        level_id: { $ref: '#/components/schemas/Id' }
        level_name:
          type: string
        raw_value:
          type: [ string, 'null' ]
        display_value:
          type: string
        kind:
          type: string
          enum: [ VALUE, UNRECOGNIZED ]
      description: Raw-варианты различаются, включая регистр. ID стабилен в пределах схемы; UNRECOGNIZED завершает
        каскад.
      allOf:
        - if:
            properties:
              kind:
                const: UNRECOGNIZED
          then:
            properties:
              raw_value:
                type: 'null'
              display_value:
                const: Не распознано
          else:
            properties:
              raw_value:
                type: string
    FacetOption:
      type: object
      additionalProperties: false
      required: [ marker_id, level_id, level_name, raw_value, display_value, kind, count ]
      properties:
        marker_id: { $ref: '#/components/schemas/Id' }
        level_id: { $ref: '#/components/schemas/Id' }
        level_name:
          type: string
        raw_value:
          type: [ string, 'null' ]
        display_value:
          type: string
        kind:
          type: string
          enum: [ VALUE, UNRECOGNIZED ]
        count:
          $ref: '#/components/schemas/Count'
          minimum: 1
      description: Точный count полного AND-пересечения. Нули скрыты; естественный порядок, UNRECOGNIZED последний.
      allOf:
        - if:
            properties:
              kind:
                const: UNRECOGNIZED
          then:
            properties:
              raw_value:
                type: 'null'
              display_value:
                const: Не распознано
          else:
            properties:
              raw_value:
                type: string
    Facet:
      type: object
      additionalProperties: false
      required: [ level_id, level_name, options ]
      properties:
        level_id: { $ref: '#/components/schemas/Id' }
        level_name:
          type: string
        options:
          type: array
          items: { $ref: '#/components/schemas/FacetOption' }
      description: Следующий уровень. options может быть пустым из-за prefix; после конечного уровня next_facet=null.
    StructureIssue:
      type: object
      additionalProperties: false
      required: [ level_id, level_name, code, message ]
      properties:
        level_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        level_name:
          type: string
        code:
          type: string
          enum: [ MISSING_REQUIRED_LEVEL, UNEXPECTED_DEPTH, INVALID_LEVEL_VALUE, INVALID_COMPOSITE_SEGMENT ]
        message:
          type: string
      description: Первое отклонение пути без угадывания уровней. Для лишнего хвоста level_id=null, level_name=Дополнительный
        уровень.
    SearchItem:
      type: object
      additionalProperties: false
      required: [ item_id, location, filename, markers, extension, size_bytes, modified_at, structure_status, structure_issue ]
      properties:
        item_id: { $ref: '#/components/schemas/Id' }
        location: { $ref: '#/components/schemas/Location' }
        filename:
          type: string
          minLength: 1
        markers:
          type: array
          items: { $ref: '#/components/schemas/Marker' }
        extension:
          type: string
          pattern: ^(?:\.[^/\\]+)?$
        size_bytes: { $ref: '#/components/schemas/Count' }
        modified_at: { $ref: '#/components/schemas/Instant' }
        structure_status:
          type: string
          enum: [ VALID, UNRECOGNIZED ]
        structure_issue:
          anyOf:
            - { $ref: '#/components/schemas/StructureIssue' }
            - type: 'null'
      description: Обычный файл любого типа/размера. markers — распознанные родители; extension содержит точку либо
        пустую строку.
      allOf:
        - if:
            properties:
              structure_status:
                const: VALID
          then:
            properties:
              structure_issue:
                type: 'null'
          else:
            properties:
              structure_issue: { $ref: '#/components/schemas/StructureIssue' }
    SearchFreshness:
      type: object
      additionalProperties: false
      required: [ indexed_at, last_successful_sync_at, status ]
      properties:
        indexed_at: { $ref: '#/components/schemas/Instant' }
        last_successful_sync_at: { $ref: '#/components/schemas/Instant' }
        status:
          type: string
          enum: [ CURRENT, UPDATING, STALE ]
      description: Свежесть опубликованного поколения; во время обновления предыдущее завершённое поколение доступно.
    SearchResponse:
      type: object
      additionalProperties: false
      required: [ request_state_id, mode, root_id, schema_set_version, index_generation, ranking_profile_version,
                  applied_query_text, selected_markers, total, returned_count, result_limit, limited, items, next_facet, freshness ]
      properties:
        request_state_id: { $ref: '#/components/schemas/Id' }
        mode:
          type: string
          enum: [ IDLE, RESULTS ]
        root_id: { $ref: '#/components/schemas/Id' }
        schema_set_version: { $ref: '#/components/schemas/Id' }
        index_generation: { $ref: '#/components/schemas/Id' }
        ranking_profile_version: { $ref: '#/components/schemas/Id' }
        applied_query_text:
          type: string
        selected_markers:
          type: array
          items: { $ref: '#/components/schemas/Marker' }
        total:
          anyOf:
            - { $ref: '#/components/schemas/Count' }
            - type: 'null'
        returned_count: { $ref: '#/components/schemas/Count' }
        result_limit: { $ref: '#/components/schemas/Count' }
        limited:
          type: boolean
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchItem' }
        next_facet:
          anyOf:
            - { $ref: '#/components/schemas/Facet' }
            - type: 'null'
        freshness: { $ref: '#/components/schemas/SearchFreshness' }
      description: В RESULTS returned_count=items.length=min(total,result_limit), limited=(total>result_limit).
        Все данные из одного index_generation. Без пагинации.
      allOf:
        - if:
            properties:
              mode:
                const: IDLE
          then:
            properties:
              total:
                type: 'null'
              items:
                maxItems: 0
              returned_count:
                const: 0
              limited:
                const: false
              applied_query_text:
                const: ''
              selected_markers:
                maxItems: 0
          else:
            properties:
              total: { $ref: '#/components/schemas/Count' }
    FacetResponse:
      type: object
      additionalProperties: false
      required: [ request_state_id, root_id, schema_set_version, index_generation, facet ]
      properties:
        request_state_id: { $ref: '#/components/schemas/Id' }
        root_id: { $ref: '#/components/schemas/Id' }
        schema_set_version: { $ref: '#/components/schemas/Id' }
        index_generation: { $ref: '#/components/schemas/Id' }
        facet:
          anyOf:
            - { $ref: '#/components/schemas/Facet' }
            - type: 'null'
      description: Ответ отдельного scope списка; его поколение может быть новее основной выдачи. request_state_id
        защищает от запоздавшего ответа.
    TargetDirectory:
      type: object
      additionalProperties: false
      properties:
        root_id: { $ref: '#/components/schemas/Id' }
        relative_directory: { $ref: '#/components/schemas/RelativeDirectory' }
        display_path:
          type: string
          minLength: 1
      required: [ root_id, relative_directory, display_path ]
      description: Существующая цель, разрешённая для компании; display_path используется только для показа.
    TargetReference:
      type: object
      additionalProperties: false
      properties:
        root_id: { $ref: '#/components/schemas/Id' }
        relative_directory: { $ref: '#/components/schemas/RelativeDirectory' }
      required: [ root_id, relative_directory ]
      description: Каноническая ссылка на разрешённый каталог.
    Rule:
      type: object
      additionalProperties: false
      properties:
        rule_id: { $ref: '#/components/schemas/Id' }
        priority:
          type: integer
          minimum: 1
          maximum: 1000
        match_field:
          type: string
          enum: [ BASENAME, RELATIVE_PATH ]
        mask:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^(?!.*\*\*).+$
        target: { $ref: '#/components/schemas/TargetReference' }
        target_stem:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^/\\\u0000-\u001F\u007F]+$
      required: [ rule_id, priority, match_field, mask, target, target_stem ]
      description: 'Маска всего выбранного поля: * — любое число символов, ? — один, без учёта регистра. В относительном
        пути * пересекает разделители. target_stem фиксирован; добавляется последний исходный суффикс.'
    DictionaryDraft:
      type: object
      additionalProperties: false
      properties:
        draft_revision: { $ref: '#/components/schemas/Revision' }
        rules:
          type: array
          items: { $ref: '#/components/schemas/Rule' }
        based_on_version_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
      required: [ draft_revision, rules, based_on_version_id ]
      description: Один общий черновик. Правка имени/описания/правил увеличивает ревизию; ручная правка после restore
        очищает based_on_version_id.
    Dictionary:
      type: object
      additionalProperties: false
      properties:
        dictionary_id: { $ref: '#/components/schemas/Id' }
        company_id: { $ref: '#/components/schemas/Id' }
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        draft: { $ref: '#/components/schemas/DictionaryDraft' }
        active_version_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        versions_count: { $ref: '#/components/schemas/Count' }
        updated_at: { $ref: '#/components/schemas/Instant' }
        updated_by: { $ref: '#/components/schemas/Actor' }
      required: [ dictionary_id, company_id, name, description, draft, active_version_id, versions_count, updated_at,
                  updated_by ]
      description: Уникальное внутри компании имя после trim+casefold. Для удаления действующих правил публикуется
        пустая версия.
    DictionaryVersion:
      type: object
      additionalProperties: false
      properties:
        version_id: { $ref: '#/components/schemas/Id' }
        dictionary_id: { $ref: '#/components/schemas/Id' }
        version_number: { $ref: '#/components/schemas/Count' }
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        rules:
          type: array
          items: { $ref: '#/components/schemas/Rule' }
        published_at: { $ref: '#/components/schemas/Instant' }
        published_by: { $ref: '#/components/schemas/Actor' }
        comment:
          type: string
          minLength: 1
          maxLength: 500
        restored_from_version_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
      required: [ version_id, dictionary_id, version_number, name, description, rules, published_at, published_by,
                  comment, restored_from_version_id ]
      description: Неизменяемая версия. Откат создаёт новую публикацию со ссылкой restored_from_version_id и не
        возвращает файлы.
    RuleSetMember:
      type: object
      additionalProperties: false
      properties:
        dictionary_id: { $ref: '#/components/schemas/Id' }
        version_id: { $ref: '#/components/schemas/Id' }
      required: [ dictionary_id, version_id ]
    RuleSet:
      type: object
      additionalProperties: false
      properties:
        rule_set_id: { $ref: '#/components/schemas/Id' }
        company_id: { $ref: '#/components/schemas/Id' }
        members:
          type: array
          items: { $ref: '#/components/schemas/RuleSetMember' }
      required: [ rule_set_id, company_id, members ]
      description: Все активные версии компании, members отсортирован по dictionary_id. Пользователь не выбирает
        состав для запуска.
    RuleReference:
      type: object
      additionalProperties: false
      properties:
        dictionary_id: { $ref: '#/components/schemas/Id' }
        version_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        rule_id: { $ref: '#/components/schemas/Id' }
      required: [ dictionary_id, version_id, rule_id ]
      description: version_id=null только для тестируемого черновика.
    FileMetadata:
      type: object
      additionalProperties: false
      properties:
        filename:
          type: string
          minLength: 1
        location: { $ref: '#/components/schemas/Location' }
        size_bytes: { $ref: '#/components/schemas/Count' }
        modified_at: { $ref: '#/components/schemas/Instant' }
      required: [ filename, location, size_bytes, modified_at ]
    CollisionDetails:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [ EXISTING_TARGET, DUPLICATE_PLAN_TARGET, MANUAL_REVIEW_NAME ]
        source_metadata: { $ref: '#/components/schemas/FileMetadata' }
        existing_target_metadata:
          anyOf:
            - { $ref: '#/components/schemas/FileMetadata' }
            - type: 'null'
        conflicting_item_ids:
          type: array
          items: { $ref: '#/components/schemas/Id' }
      required: [ kind, source_metadata, existing_target_metadata, conflicting_item_ids ]
      description: Все участники DUPLICATE_PLAN_TARGET остаются во входящих. Занятые цели не перезаписываются.
    Prediction:
      type: string
      enum: [ WILL_MOVE, WILL_MANUAL_REVIEW, REQUIRES_DECISION, NOT_READY ]
    PlanCounts:
      type: object
      additionalProperties: false
      properties:
        will_move: { $ref: '#/components/schemas/Count' }
        will_manual_review: { $ref: '#/components/schemas/Count' }
        requires_decision: { $ref: '#/components/schemas/Count' }
        not_ready: { $ref: '#/components/schemas/Count' }
        rule_conflicts: { $ref: '#/components/schemas/Count' }
        no_scenario: { $ref: '#/components/schemas/Count' }
      required: [ will_move, will_manual_review, requires_decision, not_ready, rule_conflicts, no_scenario ]
      description: Сумма первых четырёх счётчиков равна total; rule_conflicts/no_scenario — дополнительные причины,
        не слагаемые.
    PlanRow:
      type: object
      additionalProperties: false
      properties:
        item_id: { $ref: '#/components/schemas/Id' }
        item_revision: { $ref: '#/components/schemas/Revision' }
        source: { $ref: '#/components/schemas/Location' }
        filename:
          type: string
          minLength: 1
        company_id: { $ref: '#/components/schemas/Id' }
        predicted_state: { $ref: '#/components/schemas/Prediction' }
        reason_code:
          anyOf:
            - type: string
            - type: 'null'
        target:
          anyOf:
            - { $ref: '#/components/schemas/Location' }
            - type: 'null'
        matched_rules:
          type: array
          items: { $ref: '#/components/schemas/RuleReference' }
        selected_rule:
          anyOf:
            - { $ref: '#/components/schemas/RuleReference' }
            - type: 'null'
        collision:
          anyOf:
            - { $ref: '#/components/schemas/CollisionDetails' }
            - type: 'null'
      required: [ item_id, item_revision, source, filename, company_id, predicted_state, reason_code, target, matched_rules,
                  selected_rule, collision ]
      description: Прогноз без файловых операций. Разные итоговые цели совпавших правил минимального приоритета
        дают RULE_CONFLICT.
    Simulation:
      type: object
      additionalProperties: false
      properties:
        simulation_id: { $ref: '#/components/schemas/Id' }
        dictionary_id: { $ref: '#/components/schemas/Id' }
        draft_revision: { $ref: '#/components/schemas/Revision' }
        base_rule_set: { $ref: '#/components/schemas/RuleSet' }
        ready_snapshot_id: { $ref: '#/components/schemas/Id' }
        created_at: { $ref: '#/components/schemas/Instant' }
        expires_at: { $ref: '#/components/schemas/Instant' }
        total: { $ref: '#/components/schemas/Count' }
        counts: { $ref: '#/components/schemas/PlanCounts' }
        warnings:
          type: array
          items:
            type: string
        rows:
          type: array
          items: { $ref: '#/components/schemas/PlanRow' }
          maxItems: 100
        next_cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
      required: [ simulation_id, dictionary_id, draft_revision, base_rule_set, ready_snapshot_id, created_at, expires_at,
                  total, counts, warnings, rows, next_cursor ]
      description: Черновик заменяет свою версию в полном RuleSet на всех READY-файлах. Изменение черновика, RuleSet,
        READY-набора или истечение TTL инвалидирует тест. EMPTY_READY_SET не доказывает покрытие.
    ResolveTargetRequest:
      type: object
      additionalProperties: false
      properties:
        display_path:
          type: string
          minLength: 1
      required: [ display_path ]
      description: A user-entered synthetic display path. Resolver maps only an existing configured company target
        and never creates directories.
    CreateDictionaryRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
      required: [ name, description ]
      description: name uniqueness uses trim plus casefold inside the company.
    ReplaceDictionaryDraftRequest:
      type: object
      additionalProperties: false
      properties:
        expected_draft_revision: { $ref: '#/components/schemas/Revision' }
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1000
        rules:
          type: array
          items: { $ref: '#/components/schemas/Rule' }
      required: [ expected_draft_revision, name, description, rules ]
      description: Atomically replaces the complete shared draft. rule_id values must be unique; stale expected_draft_revision
        rejects the whole write without merging.
    RestoreDictionaryDraftRequest:
      type: object
      additionalProperties: false
      properties:
        version_id: { $ref: '#/components/schemas/Id' }
        expected_draft_revision: { $ref: '#/components/schemas/Revision' }
      required: [ version_id, expected_draft_revision ]
      description: Copies an immutable historical version into the shared draft and increments its revision. A restore
        must be followed by a current simulation and publication; it is not a file undo.
    CreateSimulationRequest:
      type: object
      additionalProperties: false
      properties:
        expected_draft_revision: { $ref: '#/components/schemas/Revision' }
      required: [ expected_draft_revision ]
    PublishDictionaryRequest:
      type: object
      additionalProperties: false
      properties:
        expected_draft_revision: { $ref: '#/components/schemas/Revision' }
        simulation_id: { $ref: '#/components/schemas/Id' }
        acknowledge_no_scenario:
          type: boolean
        comment:
          type: string
          minLength: 1
          maxLength: 500
      required: [ expected_draft_revision, simulation_id, acknowledge_no_scenario, comment ]
      description: Свежий тест этой ревизии, без конфликтов, с комментарием. NO_SCENARIO требует подтверждения конкретного
        simulation_id.
    DictionaryListResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Dictionary' }
      required: [ items ]
    PageTargetDirectory:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TargetDirectory' }
          maxItems: 100
        next_cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
      required: [ items, next_cursor ]
    PageDictionaryVersion:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DictionaryVersion' }
          maxItems: 100
        next_cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
      required: [ items, next_cursor ]
    PublishedDictionaryResponse:
      type: object
      additionalProperties: false
      properties:
        dictionary: { $ref: '#/components/schemas/Dictionary' }
        published_version: { $ref: '#/components/schemas/DictionaryVersion' }
        rule_set: { $ref: '#/components/schemas/RuleSet' }
      required: [ dictionary, published_version, rule_set ]
    QueueState:
      type: string
      enum: [ DISCOVERED, WAITING_READY, READY, PROCESSING, REQUIRES_DECISION, RECOVERY_REQUIRED, MISSING ]
    QueueFilters:
      type: object
      additionalProperties: false
      required: [ statuses, query_text ]
      properties:
        statuses:
          type: array
          items: { $ref: '#/components/schemas/QueueState' }
          uniqueItems: true
        query_text:
          type: string
          description: Case-insensitive substring of filename or logical incoming display path; it has no search
            grammar.
    QueueItem:
      type: object
      additionalProperties: false
      required: [ item_id, item_revision, company_id, incoming_source_id, source_name, source, filename, size_bytes,
                  modified_at, status, reason_code, selectable, active_attempt_id ]
      properties:
        item_id: { $ref: '#/components/schemas/Id' }
        item_revision: { $ref: '#/components/schemas/Revision' }
        company_id: { $ref: '#/components/schemas/Id' }
        incoming_source_id: { $ref: '#/components/schemas/Id' }
        source_name:
          type: string
          minLength: 1
        source: { $ref: '#/components/schemas/Location' }
        filename:
          type: string
          minLength: 1
        size_bytes: { $ref: '#/components/schemas/Count' }
        modified_at: { $ref: '#/components/schemas/Instant' }
        status: { $ref: '#/components/schemas/QueueState' }
        reason_code:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        selectable:
          type: boolean
          description: True only for stable READY or REQUIRES_DECISION items without an active claim; server validates
            again.
        active_attempt_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
    QueueCounters:
      type: object
      additionalProperties: false
      required: [ ready, processing, attention ]
      properties:
        ready: { $ref: '#/components/schemas/Count' }
        processing: { $ref: '#/components/schemas/Count' }
        attention:
          $ref: '#/components/schemas/Count'
          description: REQUIRES_DECISION plus RECOVERY_REQUIRED.
    QueueStatusCount:
      type: object
      additionalProperties: false
      required: [ status, count ]
      properties:
        status: { $ref: '#/components/schemas/QueueState' }
        count: { $ref: '#/components/schemas/Count' }
    QueueQueryRequest:
      type: object
      additionalProperties: false
      required: [ company_id, filters, cursor, limit ]
      properties:
        company_id: { $ref: '#/components/schemas/Id' }
        filters: { $ref: '#/components/schemas/QueueFilters' }
        cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        limit:
          type: integer
          minimum: 1
          maximum: 100
    QueueResponse:
      type: object
      additionalProperties: false
      required: [ queue_generation, items, matching_count, eligible_count, counters, status_counts, next_cursor ]
      properties:
        queue_generation: { $ref: '#/components/schemas/Id' }
        items:
          type: array
          items: { $ref: '#/components/schemas/QueueItem' }
          maxItems: 100
        matching_count: { $ref: '#/components/schemas/Count' }
        eligible_count: { $ref: '#/components/schemas/Count' }
        counters: { $ref: '#/components/schemas/QueueCounters' }
        status_counts:
          type: array
          items: { $ref: '#/components/schemas/QueueStatusCount' }
        next_cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
    SelectionItem:
      type: object
      additionalProperties: false
      required: [ item_id, item_revision ]
      properties:
        item_id: { $ref: '#/components/schemas/Id' }
        item_revision: { $ref: '#/components/schemas/Revision' }
    ExplicitSelectionRequest:
      type: object
      additionalProperties: false
      required: [ company_id, mode, items ]
      properties:
        company_id: { $ref: '#/components/schemas/Id' }
        mode:
          const: EXPLICIT
        items:
          type: array
          items: { $ref: '#/components/schemas/SelectionItem' }
          minItems: 1
          maxItems: 1000
          description: Unique item IDs from the same company; uniqueness is enforced by item_id.
    AllMatchingSelectionRequest:
      type: object
      additionalProperties: false
      required: [ company_id, mode, filters, expected_eligible_count ]
      properties:
        company_id: { $ref: '#/components/schemas/Id' }
        mode:
          const: ALL_MATCHING
        filters: { $ref: '#/components/schemas/QueueFilters' }
        expected_eligible_count: { $ref: '#/components/schemas/Count' }
    SelectionRequest:
      oneOf:
        - { $ref: '#/components/schemas/ExplicitSelectionRequest' }
        - { $ref: '#/components/schemas/AllMatchingSelectionRequest' }
    SelectionSnapshot:
      type: object
      additionalProperties: false
      required: [ selection_id, company_id, mode, selected_count, created_at, expires_at, queue_generation ]
      properties:
        selection_id: { $ref: '#/components/schemas/Id' }
        company_id: { $ref: '#/components/schemas/Id' }
        mode:
          type: string
          enum: [ EXPLICIT, ALL_MATCHING ]
        selected_count: { $ref: '#/components/schemas/Count' }
        created_at: { $ref: '#/components/schemas/Instant' }
        expires_at: { $ref: '#/components/schemas/Instant' }
        queue_generation: { $ref: '#/components/schemas/Id' }
    PreviewCreateRequest:
      type: object
      additionalProperties: false
      required: [ selection_id ]
      properties:
        selection_id: { $ref: '#/components/schemas/Id' }
    Preview:
      type: object
      additionalProperties: false
      required: [ preview_id, selection_id, company_id, rule_set, created_at, expires_at, total, counts, rows, next_cursor ]
      properties:
        preview_id: { $ref: '#/components/schemas/Id' }
        selection_id: { $ref: '#/components/schemas/Id' }
        company_id: { $ref: '#/components/schemas/Id' }
        rule_set: { $ref: '#/components/schemas/RuleSet' }
        created_at: { $ref: '#/components/schemas/Instant' }
        expires_at: { $ref: '#/components/schemas/Instant' }
        total: { $ref: '#/components/schemas/Count' }
        counts: { $ref: '#/components/schemas/PlanCounts' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PlanRow' }
          maxItems: 100
        next_cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
    DirectBatchCreateRequest:
      type: object
      additionalProperties: false
      required: [ selection_id, execution_mode ]
      properties:
        selection_id: { $ref: '#/components/schemas/Id' }
        execution_mode:
          const: DIRECT
    PreviewedBatchCreateRequest:
      type: object
      additionalProperties: false
      required: [ selection_id, execution_mode, preview_id ]
      properties:
        selection_id: { $ref: '#/components/schemas/Id' }
        execution_mode:
          const: PREVIEWED
        preview_id: { $ref: '#/components/schemas/Id' }
    BatchCreateRequest:
      oneOf:
        - { $ref: '#/components/schemas/DirectBatchCreateRequest' }
        - { $ref: '#/components/schemas/PreviewedBatchCreateRequest' }
    BatchState:
      type: string
      enum: [ ACCEPTED, RUNNING, COMPLETED, COMPLETED_WITH_ISSUES, RECOVERY_REQUIRED ]
    OutcomeState:
      type: string
      enum: [ PENDING, PROCESSING, SORTED, MANUAL_REVIEW, REQUIRES_DECISION, QUARANTINED, SKIPPED, RECOVERY_REQUIRED ]
    OutcomeReasonCode:
      anyOf:
        - type: string
          enum: [ NO_SCENARIO, RULE_CONFLICT, TARGET_OCCUPIED, MANUAL_REVIEW_NAME_OCCUPIED, TECHNICAL_ERROR, ALREADY_PROCESSING,
                  SOURCE_CHANGED, SOURCE_MISSING, RECOVERY_REQUIRED ]
        - type: 'null'
    OutcomeCounts:
      type: object
      additionalProperties: false
      required: [ sorted, manual_review, requires_decision, quarantined, skipped, recovery_required ]
      properties:
        sorted: { $ref: '#/components/schemas/Count' }
        manual_review: { $ref: '#/components/schemas/Count' }
        requires_decision: { $ref: '#/components/schemas/Count' }
        quarantined: { $ref: '#/components/schemas/Count' }
        skipped: { $ref: '#/components/schemas/Count' }
        recovery_required: { $ref: '#/components/schemas/Count' }
    Outcome:
      type: object
      additionalProperties: false
      required: [ attempt_id, item_id, item_revision, state, reason_code, source, planned_target, actual_location,
                  matched_rule, started_at, finished_at ]
      properties:
        attempt_id: { $ref: '#/components/schemas/Id' }
        item_id: { $ref: '#/components/schemas/Id' }
        item_revision: { $ref: '#/components/schemas/Revision' }
        state: { $ref: '#/components/schemas/OutcomeState' }
        reason_code: { $ref: '#/components/schemas/OutcomeReasonCode' }
        source: { $ref: '#/components/schemas/Location' }
        planned_target:
          anyOf:
            - { $ref: '#/components/schemas/Location' }
            - type: 'null'
        actual_location:
          anyOf:
            - { $ref: '#/components/schemas/Location' }
            - type: 'null'
        matched_rule:
          anyOf:
            - { $ref: '#/components/schemas/RuleReference' }
            - type: 'null'
        started_at:
          anyOf:
            - { $ref: '#/components/schemas/Instant' }
            - type: 'null'
        finished_at:
          anyOf:
            - { $ref: '#/components/schemas/Instant' }
            - type: 'null'
      allOf:
        - if:
            properties:
              state:
                enum: [ SORTED, MANUAL_REVIEW, REQUIRES_DECISION, QUARANTINED, SKIPPED ]
          then:
            properties:
              finished_at: { $ref: '#/components/schemas/Instant' }
        - if:
            properties:
              state:
                enum: [ PENDING, PROCESSING, RECOVERY_REQUIRED ]
          then:
            properties:
              finished_at:
                type: 'null'
        - if:
            properties:
              state:
                enum: [ PENDING ]
          then:
            properties:
              started_at:
                type: 'null'
              reason_code:
                type: 'null'
        - if:
            properties:
              state:
                enum: [ PROCESSING ]
          then:
            properties:
              started_at: { $ref: '#/components/schemas/Instant' }
              reason_code:
                type: 'null'
        - if:
            properties:
              state:
                enum: [ SORTED ]
          then:
            properties:
              actual_location: { $ref: '#/components/schemas/Location' }
              planned_target: { $ref: '#/components/schemas/Location' }
              matched_rule: { $ref: '#/components/schemas/RuleReference' }
              started_at: { $ref: '#/components/schemas/Instant' }
              reason_code:
                type: 'null'
        - if:
            properties:
              state:
                enum: [ MANUAL_REVIEW ]
          then:
            properties:
              actual_location: { $ref: '#/components/schemas/Location' }
              started_at: { $ref: '#/components/schemas/Instant' }
              reason_code:
                enum: [ NO_SCENARIO, RULE_CONFLICT ]
        - if:
            properties:
              state:
                enum: [ QUARANTINED ]
          then:
            properties:
              actual_location: { $ref: '#/components/schemas/Location' }
              started_at: { $ref: '#/components/schemas/Instant' }
              reason_code:
                const: TECHNICAL_ERROR
        - if:
            properties:
              state:
                enum: [ REQUIRES_DECISION ]
          then:
            properties:
              reason_code:
                enum: [ TARGET_OCCUPIED, MANUAL_REVIEW_NAME_OCCUPIED ]
        - if:
            properties:
              state:
                const: RECOVERY_REQUIRED
          then:
            properties:
              reason_code:
                const: RECOVERY_REQUIRED
        - if:
            properties:
              state:
                enum: [ SKIPPED ]
          then:
            properties:
              reason_code:
                enum: [ ALREADY_PROCESSING, SOURCE_CHANGED, SOURCE_MISSING ]
        - if:
            properties:
              state:
                const: SKIPPED
              reason_code:
                const: SOURCE_MISSING
          then:
            properties:
              actual_location:
                type: 'null'
        - if:
            properties:
              matched_rule:
                type: object
          then:
            properties:
              matched_rule:
                properties:
                  version_id: { $ref: '#/components/schemas/Id' }
      description: Состояние, причина и подтверждённое размещение согласованы. Для успешного переноса actual_location
        обязателен; null означает неизвестное размещение.
    Batch:
      type: object
      additionalProperties: false
      required: [ batch_id, company_id, actor, selection_id, preview_id, rule_set, status, created_at, started_at,
                  finished_at, selected_count, completed_count, counts, outcomes, next_cursor ]
      properties:
        batch_id: { $ref: '#/components/schemas/Id' }
        company_id: { $ref: '#/components/schemas/Id' }
        actor: { $ref: '#/components/schemas/Actor' }
        selection_id: { $ref: '#/components/schemas/Id' }
        preview_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        rule_set: { $ref: '#/components/schemas/RuleSet' }
        status: { $ref: '#/components/schemas/BatchState' }
        created_at: { $ref: '#/components/schemas/Instant' }
        started_at:
          anyOf:
            - { $ref: '#/components/schemas/Instant' }
            - type: 'null'
        finished_at:
          anyOf:
            - { $ref: '#/components/schemas/Instant' }
            - type: 'null'
        selected_count: { $ref: '#/components/schemas/Count' }
        completed_count:
          $ref: '#/components/schemas/Count'
          description: Sum of established terminal outcomes; it excludes recovery_required.
        counts: { $ref: '#/components/schemas/OutcomeCounts' }
        outcomes:
          type: array
          items: { $ref: '#/components/schemas/Outcome' }
          maxItems: 100
        next_cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
      allOf:
        - if:
            properties:
              status:
                enum: [ COMPLETED, COMPLETED_WITH_ISSUES ]
          then:
            properties:
              finished_at: { $ref: '#/components/schemas/Instant' }
              counts:
                properties:
                  recovery_required:
                    const: 0
        - if:
            properties:
              status:
                enum: [ ACCEPTED, RUNNING, RECOVERY_REQUIRED ]
          then:
            properties:
              finished_at:
                type: 'null'
        - if:
            properties:
              status:
                enum: [ RECOVERY_REQUIRED ]
          then:
            properties:
              counts:
                properties:
                  recovery_required:
                    minimum: 1
    BatchSummary:
      type: object
      additionalProperties: false
      required: [ batch_id, company_id, actor, status, created_at, finished_at, selected_count, completed_count,
                  counts ]
      properties:
        batch_id: { $ref: '#/components/schemas/Id' }
        company_id: { $ref: '#/components/schemas/Id' }
        actor: { $ref: '#/components/schemas/Actor' }
        status: { $ref: '#/components/schemas/BatchState' }
        created_at: { $ref: '#/components/schemas/Instant' }
        finished_at:
          anyOf:
            - { $ref: '#/components/schemas/Instant' }
            - type: 'null'
        selected_count: { $ref: '#/components/schemas/Count' }
        completed_count: { $ref: '#/components/schemas/Count' }
        counts: { $ref: '#/components/schemas/OutcomeCounts' }
      allOf:
        - if:
            properties:
              status:
                enum: [ COMPLETED, COMPLETED_WITH_ISSUES ]
          then:
            properties:
              finished_at: { $ref: '#/components/schemas/Instant' }
              counts:
                properties:
                  recovery_required:
                    const: 0
        - if:
            properties:
              status:
                enum: [ ACCEPTED, RUNNING, RECOVERY_REQUIRED ]
          then:
            properties:
              finished_at:
                type: 'null'
        - if:
            properties:
              status:
                enum: [ RECOVERY_REQUIRED ]
          then:
            properties:
              counts:
                properties:
                  recovery_required:
                    minimum: 1
    BatchPage:
      type: object
      additionalProperties: false
      required: [ items, next_cursor ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BatchSummary' }
          maxItems: 100
        next_cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
    QuarantineItem:
      type: object
      additionalProperties: false
      required: [ quarantine_id, revision, item_id, company_id, filename, location, original_location, reason_code,
                  quarantined_at, source_attempt_id, recovery_operation_id, can_return ]
      properties:
        quarantine_id: { $ref: '#/components/schemas/Id' }
        revision: { $ref: '#/components/schemas/Revision' }
        item_id: { $ref: '#/components/schemas/Id' }
        company_id: { $ref: '#/components/schemas/Id' }
        filename:
          type: string
          minLength: 1
        location:
          $ref: '#/components/schemas/Location'
          description: Confirmed actual technical-quarantine location.
        original_location: { $ref: '#/components/schemas/Location' }
        reason_code:
          type: string
          minLength: 1
        quarantined_at: { $ref: '#/components/schemas/Instant' }
        source_attempt_id: { $ref: '#/components/schemas/Id' }
        recovery_operation_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        can_return:
          type: boolean
    QuarantinePage:
      type: object
      additionalProperties: false
      required: [ items, next_cursor ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QuarantineItem' }
          maxItems: 100
        next_cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
    QuarantineReturnRequest:
      type: object
      additionalProperties: false
      required: [ expected_revision, comment ]
      properties:
        expected_revision: { $ref: '#/components/schemas/Revision' }
        comment:
          type: string
          minLength: 1
          maxLength: 500
    QuarantineReturnResponse:
      type: object
      additionalProperties: false
      required: [ return_operation_id, item ]
      properties:
        return_operation_id: { $ref: '#/components/schemas/Id' }
        item: { $ref: '#/components/schemas/QueueItem' }
    AuditCategory:
      type: string
      enum: [ BUSINESS, SYSTEM ]
    AuditAction:
      type: string
      enum: [ DICTIONARY_CREATED, DRAFT_SAVED, DICTIONARY_SIMULATED, DICTIONARY_PUBLISHED, DICTIONARY_RESTORED, BATCH_ACCEPTED,
              FILE_ATTEMPT_STARTED, FILE_ATTEMPT_FINISHED, QUARANTINE_RETURNED, RECOVERY_REQUIRED, LOGIN_SUCCEEDED, LOGIN_FAILED,
              LOGOUT, ACCOUNT_BLOCKED ]
    AuditResult:
      type: string
      enum: [ SUCCESS, ISSUE, FAILED ]
    AuditQueryRequest:
      type: object
      additionalProperties: false
      required: [ company_id, from, to, actor_id, action, result, query_text, cursor, limit ]
      properties:
        company_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        from: { $ref: '#/components/schemas/Instant' }
        to: { $ref: '#/components/schemas/Instant' }
        actor_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
          description: An allowed audit-filter actor ID. Mutation authors always come from the server session.
        action:
          anyOf:
            - { $ref: '#/components/schemas/AuditAction' }
            - type: 'null'
        result:
          anyOf:
            - { $ref: '#/components/schemas/AuditResult' }
            - type: 'null'
        query_text:
          type: string
          description: Case-insensitive substring of logical filename or display path; it is not stored as an audit
            event.
        cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        limit:
          type: integer
          minimum: 1
          maximum: 100
    AuditEvent:
      type: object
      additionalProperties: false
      required: [ event_id, occurred_at, actor, category, action, result, request_id, operation_id, source_attempt_id,
                  company_id, dictionary_id, version_id, rule_set_id, batch_id, attempt_id, item_id, source, target, reason_code,
                  comment ]
      properties:
        event_id: { $ref: '#/components/schemas/Id' }
        occurred_at: { $ref: '#/components/schemas/Instant' }
        actor:
          anyOf:
            - { $ref: '#/components/schemas/Actor' }
            - type: 'null'
        category: { $ref: '#/components/schemas/AuditCategory' }
        action: { $ref: '#/components/schemas/AuditAction' }
        result: { $ref: '#/components/schemas/AuditResult' }
        request_id: { $ref: '#/components/schemas/Id' }
        operation_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        source_attempt_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        company_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        dictionary_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        version_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        rule_set_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        batch_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        attempt_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        item_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        source:
          anyOf:
            - { $ref: '#/components/schemas/Location' }
            - type: 'null'
        target:
          anyOf:
            - { $ref: '#/components/schemas/Location' }
            - type: 'null'
        reason_code:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        comment:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
      allOf:
        - if:
            properties:
              category:
                enum: [ BUSINESS ]
          then:
            properties:
              actor: { $ref: '#/components/schemas/Actor' }
        - if:
            properties:
              action:
                enum: [ LOGIN_SUCCEEDED, LOGIN_FAILED, LOGOUT, ACCOUNT_BLOCKED ]
          then:
            properties:
              category:
                const: SYSTEM
          else:
            properties:
              category:
                const: BUSINESS
        - if:
            properties:
              action:
                enum: [ LOGIN_SUCCEEDED, LOGOUT, ACCOUNT_BLOCKED ]
          then:
            properties:
              actor: { $ref: '#/components/schemas/Actor' }
      description: BUSINESS-событие имеет автора. Вход/выход/блокировка относятся к SYSTEM; null actor допустим
        для системного события без установленного инициатора.
    AuditQueryResponse:
      type: object
      additionalProperties: false
      required: [ items, next_cursor, newest_event_id ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
          maxItems: 100
        next_cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
        newest_event_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
    AuditUpdatesResponse:
      type: object
      additionalProperties: false
      required: [ has_new_events ]
      properties:
        has_new_events:
          type: boolean
    ActorPage:
      type: object
      additionalProperties: false
      required: [ items, next_cursor ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Actor' }
          maxItems: 100
        next_cursor:
          anyOf:
            - type: string
              minLength: 1
            - type: 'null'
    ErrorCode:
      type: string
      enum: [ INVALID_QUERY, LOGIN_FAILED, UNAUTHENTICATED, FORBIDDEN, CSRF_FAILED, NOT_FOUND, DRAFT_VERSION_CONFLICT,
              DICTIONARY_NAME_CONFLICT, QUARANTINE_VERSION_CONFLICT, STALE_SIMULATION, STALE_PREVIEW, SELECTION_EXPIRED,
              SELECTION_CHANGED, SCHEMA_VERSION_CHANGED, ROOT_NOT_READY, RULE_CONFLICT, NO_SCENARIO_ACK_REQUIRED, ORIGINAL_PATH_OCCUPIED,
              RECOVERY_REQUIRED, IDEMPOTENCY_KEY_REUSED, INVALID_STATE, VALIDATION_ERROR, INVALID_MARKER_SELECTION, INVALID_TARGET,
              PATH_OUTSIDE_ROOT, EMPTY_SELECTION, BATCH_LIMIT_EXCEEDED, RATE_LIMITED, SEARCH_UNAVAILABLE, SERVICE_UNAVAILABLE,
              INTERNAL_ERROR ]
      description: HTTP-ошибки запроса. Причины отдельных файлов возвращаются отдельно в Outcome.
    FieldError:
      type: object
      additionalProperties: false
      required: [ field, code, message ]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      description: Безопасная ошибка поля, без эха пароля, тела запроса или физических путей.
    ErrorDetails:
      type: object
      additionalProperties: false
      required: [ code, message, request_id, operation_id, retryable, field_errors ]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
        request_id: { $ref: '#/components/schemas/Id' }
        operation_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - type: 'null'
        retryable:
          type: boolean
        field_errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
      description: operation_id=null до создания операции, иначе ID зарегистрированного recovery. retryable не отменяет
        правила безопасного повтора мутаций.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [ error ]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetails' }
      description: Безопасный неуспешный HTTP-ответ. request_id совпадает с X-Request-ID.
  responses:
    ServiceUnavailable:
      description: SERVICE_UNAVAILABLE.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - properties:
                  error:
                    properties:
                      code:
                        enum: [ SERVICE_UNAVAILABLE ]
          examples:
            SERVICE_UNAVAILABLE: { $ref: '#/components/examples/ErrorSERVICE_UNAVAILABLE' }
    InternalError:
      description: INTERNAL_ERROR.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - properties:
                  error:
                    properties:
                      code:
                        enum: [ INTERNAL_ERROR ]
          examples:
            INTERNAL_ERROR: { $ref: '#/components/examples/ErrorINTERNAL_ERROR' }
    LoginFailed:
