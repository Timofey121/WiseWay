openapi: 3.1.1
info:
  title: Wise Way API
  version: 1.0.0
  summary: Иерархический поиск и ручная сортировка файлов Wise Way.
  description: |-
    Контракт синтетической демоверсии Wise Way.
    Общие бизнес-правила и границы реализации: [semantics.md](../semantics.md).
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
  - url: /api/v1
    description: Общий origin UI и API; адрес окружения задаётся при подключении клиента.
security:
  - cookieAuth: [ ]
tags:
  - name: System
    description: Доступность и конфигурация.
  - name: Session
    description: Локальные серверные сессии.
  - name: Search
    description: Поиск метаданных и каскад уровней.
  - name: Targets
    description: Разрешённые целевые каталоги.
  - name: Dictionaries
    description: Черновики, версии и публикация правил.
  - name: Sorting
    description: Очередь, выбор, прогноз и партии.
  - name: Quarantine
    description: Подтверждённый технический карантин и возврат.
  - name: Audit
    description: Общий бизнес-журнал и системные события администратора.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверить доступность сервиса
      description: Проверка HTTP-сервиса без внутренних адресов и сведений о зависимостях.
      tags: [ System ]
      responses:
        '200':
          description: Успешное выполнение.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
              examples:
                available:
                  value:
                    status: ok
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [ ]
  /auth/login:
    post:
      operationId: login
      summary: Войти в Wise Way
      description: Проверяет логин, пароль и Origin. Устанавливает wiseway_session; неверные credentials дают общую
        LOGIN_FAILED.
      tags: [ Session ]
      responses:
        '200':
          description: Успешное выполнение.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              examples:
                authenticated: { $ref: '#/components/examples/SharedAuthenticated' }
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/LoginFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              syntheticCredentials:
                value:
                  login: worker-atlas
                  password: synthetic-password-example
      security: [ ]
  /session:
    get:
      operationId: getSession
      summary: Получить активную сессию
      description: Проверяет действующую сессию и блокировку пользователя. Абсолютный срок сессии не продлевается.
      tags: [ Session ]
      responses:
        '200':
          description: Успешное выполнение.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              examples:
                active: { $ref: '#/components/examples/SharedAuthenticated' }
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/logout:
    post:
      operationId: logout
      summary: Завершить текущую сессию
      description: Завершает сессию и удаляет cookie. Принятые партии продолжаются с исходным автором. Тело отсутствует.
      tags: [ Session ]
      responses:
        '204':
          description: Успешное выполнение.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearedSessionCookie' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
      parameters:
        - { $ref: '#/components/parameters/XCSRFToken' }
  /app-config:
    get:
      operationId: getAppConfig
      summary: Получить настройки интерфейса
      description: Возвращает фактические лимиты и интервалы опроса для UI.
      tags: [ System ]
      responses:
        '200':
          description: Успешное выполнение.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }
              examples:
                demo:
                  value:
                    api_contract_version: 1.0.0
                    display_timezone: Europe/Moscow
                    search_result_limit: 100
                    max_batch_items: 1000
                    max_query_length: 512
                    preview_ttl_seconds: 300
                    snapshot_ttl_seconds: 300
                    simulation_ttl_seconds: 300
                    batch_poll_interval_ms: 1000
                    audit_poll_interval_ms: 30000
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /roots:
    get:
      operationId: listRoots
      summary: Получить опубликованные поисковые корни
      description: Только полностью проиндексированные, сверенные и опубликованные корни.
      tags: [ Search ]
      responses:
        '200':
          description: Успешное выполнение.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RootsResponse' }
              examples:
                published:
                  value:
                    items:
                      - root_id: root-demo-1
                        label: Демонстрационный архив
                        display_prefix: DEMO:/SandboxRoot
                        schema_set_version: schema-demo-1
                        index_generation: generation-demo-1
                        indexed_at: '2031-05-10T09:30:00Z'
                nonePublished: { $ref: '#/components/examples/SharedNonepublished' }
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /companies:
    get:
      operationId: listCompanies
      summary: Получить компании
      description: Компании и логические IDs их входящих источников.
      tags: [ System ]
      responses:
        '200':
          description: Успешное выполнение.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompaniesResponse' }
              examples:
                companies:
                  value:
                    items:
                      - company_id: company-demo-1
                        name: Atlas
                        incoming_source_ids: [ incoming-demo-1 ]
                      - company_id: company-demo-2
                        name: Nova
                        incoming_source_ids: [ incoming-demo-2 ]
                empty: { $ref: '#/components/examples/SharedNonepublished' }
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /search:
    post:
      operationId: searchFiles
      summary: Найти файлы и получить следующий уровень
      description: Поиск в одном корне. Текст и цепочка уровней объединяются AND; items, total и фасеты читаются
