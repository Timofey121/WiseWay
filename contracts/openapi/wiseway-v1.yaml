      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - properties:
                  error:
                    properties:
                      code:
                        enum: [ RATE_LIMITED ]
          examples:
            RATE_LIMITED: { $ref: '#/components/examples/ErrorRATE_LIMITED' }
    Unauthenticated:
      description: UNAUTHENTICATED.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - properties:
                  error:
                    properties:
                      code:
                        enum: [ UNAUTHENTICATED ]
          examples:
            UNAUTHENTICATED: { $ref: '#/components/examples/ErrorUNAUTHENTICATED' }
    WriteForbidden:
      description: FORBIDDEN, CSRF_FAILED.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - properties:
                  error:
                    properties:
                      code:
                        enum: [ FORBIDDEN, CSRF_FAILED ]
          examples:
            FORBIDDEN: { $ref: '#/components/examples/ErrorFORBIDDEN' }
            CSRF_FAILED: { $ref: '#/components/examples/ErrorCSRF_FAILED' }
    InvalidSearchSelection:
      description: VALIDATION_ERROR, INVALID_MARKER_SELECTION.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - properties:
                  error:
                    properties:
                      code:
                        enum: [ VALIDATION_ERROR, INVALID_MARKER_SELECTION ]
          examples:
            VALIDATION_ERROR: { $ref: '#/components/examples/ErrorVALIDATION_ERROR' }
            INVALID_MARKER_SELECTION: { $ref: '#/components/examples/ErrorINVALID_MARKER_SELECTION' }
    SearchUnavailable:
      description: SERVICE_UNAVAILABLE, SEARCH_UNAVAILABLE.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - properties:
                  error:
