      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - properties:
                  error:
                    properties:
                      code:
                        enum: [ FORBIDDEN ]
          examples:
            FORBIDDEN: { $ref: '#/components/examples/ErrorFORBIDDEN' }
    ValidationError:
      description: VALIDATION_ERROR.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - properties:
                  error:
                    properties:
                      code:
                        enum: [ VALIDATION_ERROR ]
          examples:
            VALIDATION_ERROR: { $ref: '#/components/examples/ErrorVALIDATION_ERROR' }
    RateLimited:
      description: RATE_LIMITED.
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
