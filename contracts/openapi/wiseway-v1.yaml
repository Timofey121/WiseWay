      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ErrorResponse' }
              - properties:
                  error:
                    properties:
                      code:
                        enum: [ LOGIN_FAILED ]
          examples:
            LOGIN_FAILED: { $ref: '#/components/examples/ErrorLOGIN_FAILED' }
    Forbidden:
